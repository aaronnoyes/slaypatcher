# SlayPerf config. Every key can also be set from the environment as SLAYPERF_<KEY>,
# which wins over this file (e.g. SLAYPERF_PARTICLES=off in the launcher).
#
# Defaults are neutral: only CSV logging is on, so the first run is a
# baseline. Change ONE knob per run and compare the CSVs (tools/perfreport.py).

# Free-text tag shown on the HUD and in the CSV filename, e.g. "baseline" or "spine15".
label =

# On-screen stats overlay. Off by default: the CSV has everything, read it with tools/perfreport.py.
hud = false

# Write logs/perf-<time>-<label>.csv next to this file every sample_interval seconds.
# The sampler runs on its own thread, so it keeps logging through long loading stalls.
csv = true
csv_dir =
sample_interval = 1.0
# Frames slower than this count as hitches.
hitch_ms = 50

# ---- knobs ------------------------------------------------------------------------

# Particles: on | half | off
#   half: GPUParticles2D amount_ratio 0.5, CPUParticles2D amount halved
#   off : hidden (not simulated or drawn); one-shot timers still run so VFX still finish
particles = on

# Spine skeleton update rate in Hz. 0 = untouched (every frame).
# Try 20 or 15. Animations keep their real duration, they just step less often.
spine_hz = 0

# Shaders: on | passthrough
#   passthrough swaps every ShaderMaterial for one shared no-op shader. Looks WRONG on
#   purpose (no tints, dissolves, ripples). It only tells you how much the shaders cost.
shaders = on

# false = skip preloading VFX scenes during the loading screens (they load lazily on first
# use instead). Use it to see how much of the long preload times is VFX.
preload_vfx = true

# Override the engine FPS cap (0 = leave the game's setting alone).
max_fps = 0

# Modded sessions normally get a separate save profile ("modded/profileN"). This mod
# doesn't change gameplay, so keep using your normal saves.
share_saves = true
